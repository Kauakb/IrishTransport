name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    # Temporary MongoDB so the Spring Boot context test can start
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    # Override application.properties for CI only (Spring Boot reads these env vars)
    env:
      SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/transortdb
      SERVER_PORT: 8080

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B verify
