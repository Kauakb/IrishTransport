<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Transport Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
	<nav>
    <span class="logo">Irish Transport</span>
    <div>
        <a href="/transports">Home</a>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" style="background:none; border:none; color:white; cursor:pointer; font-size:15px;">Logout</button>
        </form>
    </div>
</nav>

    <div class="container">
        <h1> Transport Stop Form</h1>
        <form th:action="@{/transports}" th:object="${transport}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="form-group">
                <label>ATCO Code</label>
                <input type="text" th:field="*{atcoCode}"/>
                <span th:if="${#fields.hasErrors('atcoCode')}" th:errors="*{atcoCode}" class="error"></span>
            </div>

            <div class="form-group">
                <label>Stop Name</label>
                <input type="text" th:field="*{commonName}"/>
                <span th:if="${#fields.hasErrors('commonName')}" th:errors="*{commonName}" class="error"></span>
            </div>

            <div class="form-group">
                <label>Street</label>
                <input type="text" th:field="*{street}"/>
            </div>

            <div class="form-group">
                <label>Locality</label>
                <input type="text" th:field="*{locality}"/>
            </div>

            <div class="form-group">
                <label>Stop Type</label>
                <input type="text" th:field="*{stopType}"/>
                <span th:if="${#fields.hasErrors('stopType')}" th:errors="*{stopType}" class="error"></span>
            </div>

            <div class="form-group">
                <label>Status</label>
                <select th:field="*{status}">
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                </select>
            </div>

            <button type="submit" class="btn">Save</button>
            <a href="/transports" class="btn-cancel">Cancel</a>
        </form>
    </div>
</body>
</html>
