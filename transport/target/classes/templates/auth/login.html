<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <nav>
        <span class="logo">Irish Transport</span>
    </nav>

    <div class="auth-container">
    
    	<div style="text-align:center; margin-bottom:15px;">
    	<img src="https://media.gettyimages.com/id/884660990/photo/luas-cross-city-runs-morning-and-evening-tests-of-the-new-tram-service-this-week-13-years.jpg?s=612x612&w=gi&k=20&c=efPO7w88SRnKbpYnJrkmmC49b8hgEo5T_0Mhd35TtWE=" 
         alt="Bus" style="width:100%; border-radius:8px; margin-bottom:15px;"/>
		</div>
    
        <h1>Sign In</h1>

        <div th:if="${param.error}" style="color:red; text-align:center; margin-bottom:15px;">
            Invalid username or password!
        </div>

        <div th:if="${param.logout}" style="color:green; text-align:center; margin-bottom:15px;">
            You have been logged out.
        </div>

        <div th:if="${param.registered}" style="color:green; text-align:center; margin-bottom:15px;">
            Registration successful! Please login.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter username"/>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password"/>
            </div>

            <button type="submit" class="btn">Sign In</button>
        </form>

        <div class="auth-link">
            Don't have an account? <a href="/register">Sign Up</a>
        </div>
    </div>
</body>
</html>
