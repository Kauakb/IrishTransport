<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <nav>
        <span class="logo">Irish Transport</span>
    </nav>

    <div class="auth-container">
        <h1>Sign Up</h1>

        <div th:if="${error}" style="color:red; text-align:center; margin-bottom:15px;">
            <p th:text="${error}"></p>
        </div>

        <form th:action="@{/register}" th:object="${user}" method="post">
            <div class="form-group">
                <label>Username</label>
                <input type="text" th:field="*{username}" placeholder="Choose a username"/>
                <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="error"></span>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" th:field="*{password}" placeholder="Min 6 characters"/>
                <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error"></span>
            </div>

            <button type="submit" class="btn">Create Account</button>
        </form>

        <div class="auth-link">
            Already have an account? <a href="/login">Sign In</a>
        </div>
    </div>
</body>
</html>
